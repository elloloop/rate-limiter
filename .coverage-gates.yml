# Per-package coverage floors. Thresholds sit a few points under current
# coverage so they act as a regression ratchet: a change that drops a
# package below its floor fails CI. Raise a floor whenever coverage climbs
# comfortably above it.
default: 60

include:
  - internal/
  - cmd/
  - ratelimiterserver

packages:
  cmd/quota-service: 15
  internal/config: 68
  # internal/events has no direct unit tests post-refactor: ratelimiterserver
  # builds an inline noopEventSink instead of calling events.New("none"), and
  # cmd/quota-service's env-driven sink construction is covered by the docker
  # e2e, not by unit coverage. Floor at 0 is honest; a v0.4.1 follow-up
  # should add direct unit tests for events.New + its sink implementations.
  internal/events: 0
  internal/keys: 82
  internal/limits: 64
  internal/metrics: 60
  ratelimiterserver: 60
  ratelimiterserver/backend: 80
  ratelimiterserver/backend/redis: 64
