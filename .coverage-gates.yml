# Per-package coverage floors. Thresholds sit a few points under current
# coverage so they act as a regression ratchet: a change that drops a
# package below its floor fails CI. Raise a floor whenever coverage climbs
# comfortably above it.
default: 60

include:
  - internal/
  - cmd/
  - ratelimiterserver

packages:
  cmd/quota-service: 95
  internal/config: 100
  internal/events: 90
  internal/keys: 100
  internal/limits: 100
  internal/metrics: 100
  ratelimiterserver: 100
  ratelimiterserver/backend: 100
  ratelimiterserver/backend/redis: 98
