# Per-package coverage floors. Current gates require complete statement
# coverage for the public service, command entrypoint, and internal packages.
# Keep them at 100 unless a deliberate design change makes that impossible.
default: 100

include:
  - internal/
  - cmd/
  - ratelimiterserver

packages:
  cmd/quota-service: 100
  internal/config: 100
  internal/events: 100
  internal/keys: 100
  internal/limits: 100
  internal/metrics: 100
  ratelimiterserver: 100
  ratelimiterserver/backend: 100
  ratelimiterserver/backend/redis: 100
