name: Release

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GO_VERSION: '1.26.3'
  GOLANGCI_LINT_VERSION: 'v2.12.1'
  GOVULNCHECK_VERSION: 'v1.1.4'
  GRPCURL_VERSION: 'v1.9.3'

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Re-run every gate ci.yml runs. A broken build must NOT publish.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          only-new-issues: true
          args: --config=.golangci.yml

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      - name: govulncheck
        run: govulncheck ./...

  test:
    name: Build + Test + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test (race + coverage)
        env:
          QUOTA_TEST_REDIS_URL: redis://localhost:6379/0
        run: bash scripts/run-coverage.sh
      - name: Coverage gate (internal/ + ratelimiterserver >= 90%)
        run: bash scripts/coverage-gate.sh cover.out 90 internal/ ratelimiterserver
      - name: Coverage gate (per-package)
        run: bash scripts/coverage-gate.sh cover.out --config .coverage-gates.yml

  smoke:
    name: Boot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test -tags=smoke
        run: |
          if compgen -G "tests/smoke/*.go" > /dev/null; then
            go test -tags=smoke -timeout=120s ./tests/smoke/...
          else
            echo "no smoke tests under tests/smoke — skipping"
          fi

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Discover and run fuzz targets (seed corpus + 15s each)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t targets < <(
            grep -rEn --include='*_test.go' '^func (Fuzz[A-Za-z0-9_]+)\(' . \
              | sed -E 's|^(.*)/[^/]+:[0-9]+:func (Fuzz[A-Za-z0-9_]+).*$|\1\t\2|' \
              | sort -u
          )
          if [[ ${#targets[@]} -eq 0 ]]; then
            echo "no fuzz targets — skipping"; exit 0
          fi
          for entry in "${targets[@]}"; do
            dir="${entry%$'\t'*}"
            name="${entry##*$'\t'}"
            echo "::group::fuzz $name in $dir"
            go test -run="^${name}$" -timeout=120s "./$dir"
            go test -run='^$' -fuzz="^${name}$" -fuzztime=15s -parallel=4 -timeout=120s "./$dir"
            echo "::endgroup::"
          done

  docker-smoke:
    name: Docker Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: server
          push: false
          load: true
          tags: rate-limiter:release-smoke

  e2e:
    name: Release E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install grpcurl
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/fullstorydev/grpcurl/cmd/grpcurl@${{ env.GRPCURL_VERSION }}
      - name: Run Docker Compose critical RPC e2e
        run: test/e2e/docker-compose-critical-rpcs.sh

  # ---------------------------------------------------------------------------
  # Build, push, and sign the published multi-arch image.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: [lint, vuln, test, smoke, fuzz, docker-smoke, e2e]
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless OIDC
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v6

      - name: Inject version from git tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "$VER" > VERSION

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
            type=sha,prefix=sha-

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          target: server
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign published image (keyless OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Sign each tag's specific digest. cosign records the signature in the same registry.
          for tag in $TAGS; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

  # ---------------------------------------------------------------------------
  # Post-publish image vulnerability scan. The tag is already published; this
  # fails the run (and surfaces a SARIF alert) if HIGH/CRITICAL CVEs are found
  # so the operator is warned before users pull it.
  # ---------------------------------------------------------------------------
  scan-image:
    name: Scan published image (Trivy)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Pick first tag for scanning
        id: tag
        env:
          TAGS: ${{ needs.build-and-push.outputs.tags }}
        run: |
          first_tag="$(echo "$TAGS" | head -n1)"
          echo "image=${first_tag}" >> "$GITHUB_OUTPUT"

      - name: Run Trivy vulnerability scanner
        # v0.36.0, pinned by commit SHA against tag retargeting.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.image }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

  verify-published-image:
    name: Verify Published Image
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and run published image
        env:
          VERSION: ${{ github.ref_name }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          VER="${VERSION#v}"
          docker buildx imagetools inspect "${IMAGE}:${VER}"
          docker pull "${IMAGE}:${VER}"
          docker run --rm "${IMAGE}:${VER}" version | tee version.txt
          grep -q "$VER" version.txt

  release-artifacts:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-push, verify-published-image]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Build proto archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${VERSION#v}"
          mkdir -p dist
          tar -czf "dist/rate-limiter-protos-${VER}.tar.gz" quota buf.yaml buf.gen.yaml
          zip -r "dist/rate-limiter-protos-${VER}.zip" quota buf.yaml buf.gen.yaml
          (cd dist && sha256sum \
            "rate-limiter-protos-${VER}.tar.gz" \
            "rate-limiter-protos-${VER}.zip" \
            > "rate-limiter-protos-${VER}.sha256")

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          set -euo pipefail
          VER="${VERSION#v}"
          notes_file="$(mktemp)"
          {
            echo "## Container image"
            echo
            echo "\`${IMAGE}:${VER}\`"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Signed via cosign keyless OIDC and scanned with Trivy (HIGH/CRITICAL gate)."
            echo
            echo "## Proto bundle"
            echo
            echo "The \`rate-limiter-protos-${VER}.{tar.gz,zip}\` archives contain the \`quota/\` protobuf contract, \`buf.yaml\`, and \`buf.gen.yaml\` from this tag. Consumers can vendor or codegen against this exact version without depending on a git ref."
            echo
            echo "Verify integrity using the accompanying \`rate-limiter-protos-${VER}.sha256\` file."
          } > "$notes_file"

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file "$notes_file" \
            "dist/rate-limiter-protos-${VER}.tar.gz" \
            "dist/rate-limiter-protos-${VER}.zip" \
            "dist/rate-limiter-protos-${VER}.sha256"

  docs:
    name: Verify Release Docs
    runs-on: ubuntu-latest
    needs: [release-artifacts]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - name: Install docs dependencies
        working-directory: docs-site
        run: pnpm install --frozen-lockfile=false
      - name: Build docs
        working-directory: docs-site
        run: pnpm build
