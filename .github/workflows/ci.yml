name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.3'

permissions:
  contents: read

jobs:
  protobuf:
    name: Protobuf
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install buf and plugins
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/bufbuild/buf/cmd/buf@latest
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - name: buf lint
        run: buf lint
      - name: buf generate
        run: buf generate
      - name: Generated files are committed
        run: git diff --exit-code -- gen

  test:
    name: Go Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go mod tidy
        run: go mod tidy
      - name: go.mod and go.sum are committed
        run: git diff --exit-code -- go.mod go.sum
      - name: go test
        env:
          QUOTA_TEST_REDIS_URL: redis://localhost:6379/0
        run: go test -race -count=1 ./...

  docs:
    name: Docs Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - name: Install docs dependencies
        working-directory: docs-site
        run: pnpm install --frozen-lockfile=false
      - name: Build docs
        working-directory: docs-site
        run: pnpm build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: docker build --target server
        uses: docker/build-push-action@v7
        with:
          context: .
          target: server
          push: false
          load: true
          tags: rate-limiter:ci
          cache-from: type=gha,scope=ci-docker
          cache-to: type=gha,mode=max,scope=ci-docker

  e2e:
    name: Docker Compose E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install grpcurl
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/fullstorydev/grpcurl/cmd/grpcurl@latest
      - name: Run Docker Compose e2e smoke
        run: test/e2e/docker-compose-smoke.sh

  security:
    name: Filesystem Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [protobuf, test, docs, docker, e2e, security]
    steps:
      - run: echo "All checks passed"
